# https://github.com/go-task/task
version: "3"

vars:
  DEFAULT_STYLE: double
  DEFAULT_SEED: "1337"
  DEFAULT_WIDTH: "18"
  DEFAULT_HEIGHT: "24"
  DUNGEON_TYPE: chambers
  DUNGEON_WIDTH: "50"
  DUNGEON_HEIGHT: "30"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list --sort=none
    silent: true

  fmt:
    desc: Format the code
    aliases:
      - format
    preconditions:
      - &cargo
        sh: command -v cargo >/dev/null 2>&1
        msg: cargo is not installed. Please install Rust via https://rustup.rs
    cmds:
      - cargo fmt

  fmt:check:
    desc: Check formatting without modifying files
    preconditions:
      - *cargo
    cmds:
      - cargo fmt --check

  lint:
    desc: Lint the code
    preconditions:
      - *cargo
    cmds:
      - cargo clippy --workspace --all-targets

  lint:fix:
    desc: Lint the code and apply fixes
    aliases:
      - fix
    preconditions:
      - *cargo
    cmds:
      - cargo clippy --fix --allow-staged --workspace --all-targets

  test:
    desc: Run all tests
    preconditions:
      - *cargo
    cmds:
      - cargo test --workspace {{.CLI_ARGS}}

  build:
    desc: Build the workspace
    preconditions:
      - *cargo
    sources:
      - Cargo.lock
      - Cargo.toml
      - amaze/Cargo.toml
      - amaze-cli/Cargo.toml
      - amaze-gui/Cargo.toml
      - amaze/src/**/*.rs
      - amaze-cli/src/**/*.rs
      - amaze-gui/src/**/*.rs
    generates:
      - target/debug/amaze-cli
      - target/debug/amaze-gui
    cmds:
      - cargo build

  check:
    desc: Run all static checks (format + lint)
    cmds:
      - task: fmt:check
      - task: lint

  ci:
    desc: Run the full CI sequence (checks, tests, build)
    cmds:
      - task: check
      - task: test
      - task: build

  clean:
    desc: Remove build output
    preconditions:
      - *cargo
    status:
      - test ! -d target
    cmds:
      - cargo clean

  run:
    desc: Show the maze GUI
    aliases:
      - gui
      - run:gui
      - show-gui
      - example:gui
    preconditions:
      - *cargo
    cmds:
      - cargo run --release --bin amaze-gui

  run:terminal:
    desc: Render a maze in terminal output
    aliases:
      - cli
      - terminal
      - example:cli
    preconditions:
      - *cargo
    cmds:
      - >-
        cargo run --bin amaze-cli -- gen
        --seed {{default .DEFAULT_SEED .SEED}}
        --width {{default .DEFAULT_WIDTH .WIDTH}}
        --height {{default .DEFAULT_HEIGHT .HEIGHT}}
        --style {{default .DEFAULT_STYLE .STYLE}}

  run:dungeon:
    desc: Render a dungeon in terminal output
    aliases:
      - dungeon
      - example:dungeon
    preconditions:
      - *cargo
    cmds:
      - >-
        cargo run --bin amaze-cli -- gen-dungeon
        --type {{default .DUNGEON_TYPE .TYPE}}
        --seed {{default .DEFAULT_SEED .SEED}}
        --width {{default .DUNGEON_WIDTH .WIDTH}}
        --height {{default .DUNGEON_HEIGHT .HEIGHT}}

  run:ppm:
    desc: Render a maze in PPM format
    aliases:
      - ppm
      - example:ppm
      - show-example-ppm
    preconditions:
      - *cargo
    cmds:
      - >-
        cargo run --bin amaze-cli -- gen
        --seed {{default .DEFAULT_SEED .SEED}}
        --width {{default .DEFAULT_WIDTH .WIDTH}}
        --height {{default .DEFAULT_HEIGHT .HEIGHT}}
        --style ppm | tee test.ppm

  run:pbm:
    desc: Render a maze in PBM format
    aliases:
      - pbm
      - example:pbm
      - show-example-pbm
    preconditions:
      - *cargo
    cmds:
      - >-
        cargo run --bin amaze-cli -- gen
        --seed {{default .DEFAULT_SEED .SEED}}
        --width {{default .DEFAULT_WIDTH .WIDTH}}
        --height {{default .DEFAULT_HEIGHT .HEIGHT}}
        --style pbm | tee test.pbm

  docs:
    desc: Build rustdoc
    aliases:
      - doc
    preconditions:
      - *cargo
    cmds:
      - "cargo doc --no-deps --all-features"

  docs:open:
    desc: Build rustdoc (and open them)
    aliases:
      - doc:open
    preconditions:
      - *cargo
    cmds:
      - "cargo doc --no-deps --all-features --open"
